  <text x="110" y="99" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">📋 需求与 JD</text>

  <!-- Phase box: 简历筛选 -->
  <rect x="40" y="390" width="1120" height="280" rx="12" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4"/>
  <rect x="40" y="390" width="140" height="28" rx="6" fill="#818cf8"/>
  <text x="110" y="409" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">📄 简历筛选</text>

  <!-- Phase box: 面试管理 -->
